apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ska-icams-web-app
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  ingressClassName: nginx
  rules:
    - host: k8s.miditf.internal.skao.int
      http:
        paths:
          - path: /ska-ams
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-ska-icams-web-app
                port:
                  number: 8080
