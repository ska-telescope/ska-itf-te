---
# This task validates that the SPFRx host is reachable via SSH at the
# ansible_host address listed for it in the [spfrx_mid] inventory group.
# It is tagged "never" so it only runs when explicitly requested (see the
# validate_spfrx make target).

# The RXPU-facing interface must be on the same subnet as the RXPU's new IP before it can be reached.
- name: Point RXPU-facing interface at this dish's RXPU subnet in local netplan config
  ansible.builtin.replace:
    path: "{{ netplan_path }}"
    regexp: '(?s)(enx54af9786d668:\s*\n\s*addresses:\s*\n\s*- )[0-9.]+/[0-9]+'
    replace: '\g<1>10.160.{{ dish_index }}.4/24'
  become: true
  delegate_to: localhost
  tags:
    - spfrx_validate
    - never

- name: Apply local netplan configuration
  ansible.builtin.command: netplan apply
  become: true
  delegate_to: localhost
  tags:
    - spfrx_validate
    - never

- name: Wait for device to be reachable at its listed ansible_host
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: 22
    delay: 5
    timeout: 60
    state: started
  delegate_to: localhost
  tags:
    - spfrx_validate
    - never

- name: Query NTP server offset
  become: true
  ansible.builtin.command: ntpdate -q {{ ntp_server }}
  register: ntpdate_output
  changed_when: false
  tags:
    - spfrx_validate
    - never

- name: Show NTP offset output
  ansible.builtin.debug:
    msg: "{{ ntpdate_output.stdout }}"
  tags:
    - spfrx_validate
    - never

# Restore the RXPU-facing interface so it can be used the same way for the next validation run.
- name: Restore RXPU-facing interface to its original address in local netplan config
  ansible.builtin.replace:
    path: "{{ netplan_path }}"
    regexp: '(?s)(enx54af9786d668:\s*\n\s*addresses:\s*\n\s*- )[0-9.]+/[0-9]+'
    replace: '\g<1>10.10.101.100/24'
  become: true
  delegate_to: localhost
  tags:
    - spfrx_validate
    - never

- name: Re-apply local netplan configuration after restoring original address
  ansible.builtin.command: netplan apply
  become: true
  delegate_to: localhost
  tags:
    - spfrx_validate
    - never
