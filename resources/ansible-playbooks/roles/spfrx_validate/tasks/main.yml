---
# These tasks require human intervention before they can succeed: after the
# network configuration applied by the spfrx_setup role, the device moves to
# a new subnet and is no longer reachable at its original ansible_host until
# someone completes the manual step (e.g. moving a network cable/patch).
# They are therefore split out into their own role, tagged "never" so they
# only run when explicitly requested (see the validate_spfrx make target).

- name: Set expected new IP address
  ansible.builtin.set_fact:
    new_ip: "{{ ('10.160.' + dish_index | string + '.5') if dish_index is defined else ansible_host }}"
  tags:
    - spfrx_validate
    - never

- name: Wait for device to be reachable on new IP address
  ansible.builtin.wait_for:
    host: "{{ new_ip }}"
    port: 22
    delay: 5
    timeout: 60
    state: started
  delegate_to: localhost
  tags:
    - spfrx_validate
    - never
