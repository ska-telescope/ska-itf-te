---
# This task validates that the SPFRx host is reachable via SSH at the
# ansible_host address listed for it in the [spfrx_mid] inventory group.
# It is tagged "never" so it only runs when explicitly requested (see the
# validate_spfrx make target).

- name: Wait for device to be reachable at its listed ansible_host
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: 22
    delay: 5
    timeout: 60
    state: started
  delegate_to: localhost
  tags:
    - spfrx_validate
    - never
