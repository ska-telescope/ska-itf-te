# Chart-level overrides for TMC data files (dish layout, VCC config, global pointing model).
# These are TEAPOT-specific tmdata sources and must only be applied via .teapot_rules,
# never as defaults for other (e.g. staging) environments.
ska-tmc-mid:
  deviceServers:
    centralnode:
      DefaultArrayLayoutSourceURIs: "car:ska-mid?main#tmdata"
      DefaultArrayLayoutPath: "instrument/ska1_mid_itf/layout/b5dc-test-itf-layout.json"
      DishVccConfig:
        DishVccUri: "car:ska-mid?main#tmdata"
        DishVccFilePath: "instrument/ska1_mid_itf/vcc-config/ska-mid-b5dc-102-cbf-system-parameters.json"
      global_pointing_model:
        version: "main"
        interface: "https://schema.skao.int/ska-mid-dish-gpm/1.2"
        data_sources_prefix: "gitlab://gitlab.com/ska-telescope/ska-mid"
        file_path_prefix: "instrument/ska1_mid_itf/gpm"
