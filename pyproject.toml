[project]
name = "ska-mid-itf"
version = "31.4.0"
description = "Integration testing and deployment project for the Mid ITF"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = "BSD-3-Clause"
authors = [{ name = "ATLAS" }]
dependencies = [
	"ska-tmc-cdm>=8.3.0",
	"pytest-json-report>=1.5.0,<2.0.0",
	"pytest-repeat>=0.9.1,<0.10.0",
	"ska_ser_logging>=0.4.1,<0.5.0",
	"pyyaml>=6.0.1,<7.0.0",
	"httpx>=0.27.0,<0.28.0",
	"h11>=0.14.0,<0.15.0",
	"annotated-types>=0.6.0,<1.0.0",
	"black>=24.3.0,<25.0.0",
	"ska-telmodel>=1.13.0,<2.0.0",
	"ska-oso-scripting==17.0.0",
	"astropy>=6.0.0,<7.0.0",
	"pydantic[email]>=2.12.5,<3.0.0",
	"ska-schemas>=1.36.0,<2.0.0",
	"psycopg[binary]>=3.3.3,<4.0.0",
	"assertpy>=1.1,<2.0.0",
	"lxml>=6.0.4,<7.0.0",
	"diagrams>=0.25.1,<0.26.0",
	"mock>=5.2.0,<6.0.0",
	"kubernetes>=35.0.0,<36.0.0",
]

[project.scripts]
telescope_state_control = "scripts.telescope_control.state:main"
upload-to-confluence = "scripts.confluence.upload_to_confluence:main"

[dependency-groups]
docs = [
	"Sphinx>=7.2.6,<8.0.0",
	"sphinx-rtd-theme>=1.3.0,<2.0.0",
	"recommonmark>=0.7.1,<0.8.0",
	"markupsafe>=2.1.0,<3.0.0",
]
dev = [
	"black>=24.2.0,<25.0.0",
	"flake8>=7.0.0,<8.0.0",
	"isort>=5.12.0,<6.0.0",
	"pylint>=3.1.0,<4.0.0",
	"pylint-junit>=0.3.2,<0.4.0",
	"pytest-cov>=4.0.0,<5.0.0",
	"flake8-docstrings>=1.7.0,<2.0.0",
	"flake8-rst-docstrings>=0.3.0,<0.4.0",
	"darglint>=1.8.1,<2.0.0",
	"mypy>=1.8.0,<2.0.0",
	"ruff>=0.6.0,<1.0.0",
	"twine>=5.0.0,<6.0.0",
	"ipykernel>=6.29.5,<7.0.0",
]
ansible = [
	"ansible>=9.3.0,<10.0.0",
	"ansible-compat>=25.1.0,<26.0.0",
	"ansible-lint>=25.0.0,<26.0.0; platform_system != 'Windows'",
]
engineering-tools = [
	"ska-mid-itf-engineering-tools==0.10.4",
	"python-casacore<3.8; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[[tool.uv.index]]
name = "skao"
url = "https://artefact.skao.int/repository/pypi-internal/simple"

[[tool.uv.index]]
name = "pypi-public"
url = "https://pypi.org/simple"
default = true

[tool.uv]
default-groups = ["docs", "dev", "ansible", "engineering-tools"]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
ska-tmc-cdm = { index = "skao" }
ska_ser_logging = { index = "skao" }
ska-mid-itf-engineering-tools = { index = "skao" }
ska-control-model = { index = "skao" }
ska-telmodel = { index = "skao" }
ska-oso-scripting = { index = "skao" }
ska-db-oda = { index = "skao" }
ska-schemas = { index = "skao" }

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*", "utils*"]

[tool.pytest.ini_options]
addopts = "-p no:warnings"
testpaths = ["tests/integration"]
log_cli_level = "INFO"
log_cli = "True"
junit_family = "xunit2"
python_classes = "!Test"
#bdd_features_base_dir = "tests"

[tool.build_sphinx]
source-dir = "docs/src"
build-dir = "docs/_build"
all_files = 1
builder = "html"

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 99

[tool.flake8]
max-line-length = 99

[tool.black]
line_length = 99
